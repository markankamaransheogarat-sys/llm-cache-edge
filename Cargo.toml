[package]
name = "llm-cache-edge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "High-throughput sub-millisecond L1/L2 semantic caching reverse proxy for OpenAI, Ollama, vLLM, and Anthropic"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markankamaransheogarat-sys/llm-cache-edge"
keywords = ["llm", "cache", "semantic-cache", "simhash", "proxy"]
categories = ["network-programming", "web-programming", "command-line-utilities"]

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
